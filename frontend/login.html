<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back - SpendWise</title>
  <meta name="description" content="Log in to your SpendWise Premium Account to manage transaction flows and budgets.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-split-container">
    <!-- Right Pane: Authentication Form -->
    <div class="auth-right-pane">
      <div class="auth-form-card">
        <!-- Logo inside card -->
        <div class="auth-card-logo" style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 1.5rem;">
          <div class="auth-logo-icon" style="width: 28px; height: 28px; font-size: 0.95rem; background-color: var(--accent-green); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800;">S</div>
          <span class="auth-brand-name" style="font-size: 1.25rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.5px;">SpendWise</span>
        </div>
        <h1>Welcome back</h1>
        <p class="subtitle">Please enter your details to access your account.</p>

        <!-- Alert Notification Box -->
        <div id="alert-container" class="alert alert-danger" style="display: none; padding: 10px 12px; font-size: 0.85rem; border-radius: 8px; margin-bottom: 1.25rem; align-items: center; gap: 8px;">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 18px; height: 18px; flex-shrink: 0;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
          <span id="alert-text"></span>
        </div>

        <form id="login-form">
          <div class="form-group" style="margin-bottom: 1.25rem;">
            <label for="email" class="form-label" style="font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block;">Email Address</label>
            <div class="auth-input-wrapper">
              <svg class="auth-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
              </svg>
              <input type="email" id="email" class="auth-input-field" placeholder="name@company.com" required autocomplete="email">
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 1.25rem;">
            <label for="password" class="form-label" style="font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block;">Password</label>
            <div class="auth-input-wrapper">
              <svg class="auth-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
              <input type="password" id="password" class="auth-input-field" placeholder="••••••••" required autocomplete="current-password">
              <button type="button" class="password-toggle-btn" id="password-toggle" aria-label="Toggle password visibility">
                <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 18px; height: 18px;">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-checkbox-row">
            <label>
              <input type="checkbox" id="remember-me" style="accent-color: var(--accent-green); cursor: pointer;">
              Remember Me
            </label>
            <a href="#" onclick="alert('Password reset link is currently unavailable in offline demo mode.')">Forgot Password?</a>
          </div>

          <button type="submit" class="btn-spendwise" style="width: 100%; padding: 13px; font-size: 0.95rem; margin-bottom: 1.5rem;">
            Log In &nbsp; &rarr;
          </button>
        </form>

        <div class="social-divider">OR CONTINUE WITH</div>

        <div class="social-btn-row">
          <button class="social-btn" onclick="alert('OAuth integrations are not active in local development server.')">
            <!-- Simple Google Logo placeholder -->
            <svg viewBox="0 0 24 24" width="16" height="16" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            Google
          </button>
          
          <button class="social-btn" onclick="alert('OAuth integrations are not active in local development server.')">
            <!-- Simple Apple logo placeholder -->
            <svg viewBox="0 0 24 24" width="16" height="16" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 4.17c.66-.81 1.11-1.93.99-3.06-1 .04-2.2.67-2.92 1.51-.62.73-1.16 1.87-1.01 2.98 1.11.09 2.23-.59 2.94-1.43z"/>
            </svg>
            Apple
          </button>
        </div>

        <div style="text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
          Don't have an account? <a href="/signup.html" style="color: var(--accent-green); text-decoration: none; font-weight: 700;">Sign up for free</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    // Password visibility toggle behavior
    document.getElementById('password-toggle').addEventListener('click', function() {
      const passwordField = document.getElementById('password');
      const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordField.setAttribute('type', type);
      
      // Toggle icon styling
      this.classList.toggle('active');
    });
  </script>
</body>
</html>
