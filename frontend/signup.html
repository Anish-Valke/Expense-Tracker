<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - SpendWise</title>
  <meta name="description" content="Register your SpendWise Premium Account to establish budgets and monitor assets.">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-split-container">
    <!-- Right Pane: Authentication Form -->
    <div class="auth-right-pane">
      <div class="auth-form-card">
        <!-- Logo inside card -->
        <div class="auth-card-logo" style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 1.5rem;">
          <div class="auth-logo-icon" style="width: 28px; height: 28px; font-size: 0.95rem; background-color: var(--accent-green); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800;">S</div>
          <span class="auth-brand-name" style="font-size: 1.25rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.5px;">SpendWise</span>
        </div>
        <h1>Create account</h1>
        <p class="subtitle">Enter your credentials to set up your account.</p>

        <!-- Alert Notification Box -->
        <div id="alert-container" class="alert alert-danger" style="display: none; padding: 10px 12px; font-size: 0.85rem; border-radius: 8px; margin-bottom: 1.25rem; align-items: center; gap: 8px;">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width: 18px; height: 18px; flex-shrink: 0;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
          <span id="alert-text"></span>
        </div>

        <form id="signup-form">
          <div class="form-group" style="margin-bottom: 1.15rem;">
            <label for="username" class="form-label" style="font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block;">Username</label>
            <div class="auth-input-wrapper">
              <svg class="auth-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
              <input type="text" id="username" class="auth-input-field" placeholder="username" required autocomplete="username">
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 1.15rem;">
            <label for="email" class="form-label" style="font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block;">Email Address</label>
            <div class="auth-input-wrapper">
              <svg class="auth-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
              </svg>
              <input type="email" id="email" class="auth-input-field" placeholder="name@company.com" required autocomplete="email">
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 1.15rem;">
            <label for="password" class="form-label" style="font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block;">Password</label>
            <div class="auth-input-wrapper">
              <svg class="auth-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
              <input type="password" id="password" class="auth-input-field" placeholder="Min. 6 characters" required autocomplete="new-password">
            </div>
          </div>

          <div class="form-group" style="margin-bottom: 1.5rem;">
            <label for="confirm-password" class="form-label" style="font-size: 0.82rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; display: block;">Confirm Password</label>
            <div class="auth-input-wrapper">
              <svg class="auth-input-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
              </svg>
              <input type="password" id="confirm-password" class="auth-input-field" placeholder="Re-enter password" required autocomplete="new-password">
            </div>
          </div>

          <button type="submit" class="btn-spendwise" style="width: 100%; padding: 13px; font-size: 0.95rem; margin-bottom: 1.5rem;">
            Register Account &nbsp; &rarr;
          </button>
        </form>

        <div style="text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
          Already have an account? <a href="/login.html" style="color: var(--accent-green); text-decoration: none; font-weight: 700;">Sign in</a>
        </div>
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
